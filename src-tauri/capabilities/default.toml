# TOML rather than JSON, for the same reason `tauri.conf.json5` is JSON5.

identifier = "default"
description = "What the frontend may ask the app to do."
windows = ["main"]

# Exactly what the native writer does, and nothing more: ask where, then write
# there. No path allowlist accompanies the write — the save dialog injects the
# path the user chose into the fs plugin's runtime scope, which is what the fs
# commands consult, so granting `$HOME/**` up front would only widen what a
# compromised frontend could reach. Nothing reads a file yet, so nothing grants
# `dialog:allow-open` or `fs:allow-read-text-file`; Save and Open will.
permissions = ["core:default", "dialog:allow-save", "fs:allow-write-text-file"]
